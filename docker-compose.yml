services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: launcher
      POSTGRES_PASSWORD: launcher
      POSTGRES_DB: launcher
    ports:
      - "5432:5432"
    volumes:
      - launcher-pg:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - launcher-redis:/data

volumes:
  launcher-pg:
  launcher-redis:
